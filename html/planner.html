<!doctype html>
<html lang="ko">
<head>
  <script src="../js/pc-only.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="학교 학적에 연결되지 않는 브라우저 직접 입력">
  <title>내정보 | 한모</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="../img/favicon-purple.svg">
  <link rel="stylesheet" href="../css/student-ui.css">
  <script src="../js/student-preferences.js" defer></script>
  <script src="../js/student-entry.js" defer></script>
  <script src="../js/student-profile-bar.js" defer></script>
  <link rel="stylesheet" href="../css/hanmo-policy-footer.css">
  <link rel="stylesheet" href="../css/hanmo-title-divider.css">
  <link rel="stylesheet" href="../css/hanmo-refined.css">
</head>
<body class="hanmo-refined hanmo-ui">
  <a class="hanmo-skip" href="#main">본문으로 이동</a>
  <header class="hanmo-topbar">
  <a class="hanmo-brand" href="../index.html" aria-label="한모 홈으로 이동"><img src="../img/hanmo_white.svg" width="29" height="24" alt="">한모</a>
  <nav aria-label="주요 서비스">
    <a href="./readiness.html">PC 진단</a>
    <a href="./reaction-test.html">반응속도 테스트</a>
    <a href="./strategy-lab.html">전략 실험</a>
    <a href="./academic-timeline.html">학사 정보</a>
    <a href="./catalog.html">강의 검색</a>
    <span class="hanmo-profile-summary" data-profile-summary role="status" aria-live="polite" aria-label="브라우저에 저장한 내정보, 학교 로그인 아님">내정보 미설정</span>
    <a class="hanmo-me-link" href="./planner.html" aria-current="page">내정보</a>
  </nav>
</header>
  <main id="main" class="hanmo-main" tabindex="-1">
  <div class="hanmo-schoolmark" aria-label="내정보 화면">
    <h1>내정보</h1>
    <div class="hanmo-title-divider" aria-hidden="true"><hr><span><img src="../img/hanmo_white.svg" alt=""></span><hr></div>

    
  </div>
<section class="hanmo-card" aria-label="프로필 설정">
  <form class="hanmo-form" id="planner-profile">
    <div class="hanmo-fields">
      <label class="hanmo-field" for="planner-campus">캠퍼스
        <select id="planner-campus" required><option value="">캠퍼스를 선택하세요</option><option value="SEOUL">서울캠퍼스</option><option value="GLOBAL">글로벌캠퍼스</option></select>
      </label>
      <label class="hanmo-field" for="planner-major">주전공
        <input id="planner-major" type="text" maxlength="100" autocomplete="off" placeholder="예: 경제학전공" required>
      </label>
      <label class="hanmo-field" for="planner-secondary-kind">이중전공 · 부전공
        <select id="planner-secondary-kind">
          <option value="NONE">없음</option>
          <option value="DOUBLE">이중전공</option>
          <option value="MINOR">부전공</option>
        </select>
      </label>
      <label class="hanmo-field" for="planner-double">선택한 이중전공·부전공명
        <input id="planner-double" type="text" maxlength="100" autocomplete="off" placeholder="이중전공 또는 부전공을 선택하세요" disabled>
      </label>
      <label class="hanmo-field" for="planner-cohort">입학년도
        <input id="planner-cohort" type="number" min="2010" max="2100" step="1" placeholder="예: 2024" required>
      </label>
    </div>
    <div class="hanmo-actions"><button class="hanmo-btn" type="submit">이 브라우저에 저장</button><button class="hanmo-btn secondary" id="planner-clear" type="button">저장한 정보 지우기</button><button class="hanmo-btn" id="planner-go-notices" type="button">학사 공지 보기<span class="hm-icon hm-icon-next" aria-hidden="true"></span></button></div>
    <p class="hanmo-status" id="planner-message" role="status" aria-live="polite"></p>
  </form>
</section>
</main>
  <footer class="hanmo-policy-footer" aria-label="비공식 서비스 안내"><p><strong>본 서비스는 한국외국어대학교의 공식 서비스가 아니며, 정확한 정보는 학교 원문을 확인하시기 바랍니다.</strong></p></footer>
</body>
</html>
