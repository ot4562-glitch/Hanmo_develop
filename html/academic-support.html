<!doctype html>
<html lang="ko">
<head>
  <script src="../js/pc-only.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="문의 주제별 외부 검색 경로 안내">
  <title>학교 문의처 | 한모</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="../img/favicon-purple.svg">
  <link rel="stylesheet" href="../css/student-ui.css">
  <link rel="stylesheet" href="../css/hanmo-title-divider.css">
  <link rel="stylesheet" href="../css/academic-support.css">
  <link rel="stylesheet" href="../css/hanmo-policy-footer.css">
  <script src="../js/academic-support.js" defer></script>
  <script src="../js/student-profile-bar.js" defer></script>
  <link rel="stylesheet" href="../css/hanmo-refined.css">
</head>
<body class="hanmo-refined hanmo-ui hanmo-support-page">
  <a class="hanmo-skip" href="#main">본문으로 이동</a>
  <header class="hanmo-topbar">
    <a class="hanmo-brand" href="../index.html" aria-label="한모 홈으로 이동"><img src="../img/hanmo_white.svg" width="29" height="24" alt="">한모</a>
    <nav aria-label="주요 서비스">
      <a href="./academic-timeline.html">학사 공지</a>
      <a href="./catalog.html">강의 검색</a>
      <a href="./academic-calendar.html">학사 달력</a>
      <a href="./academic-support.html" aria-current="page">학교 문의처</a>
      <span class="hanmo-profile-summary" data-profile-summary role="status" aria-live="polite" aria-label="브라우저에 저장한 내정보, 학교 로그인 아님">내정보 미설정</span>
      <a class="hanmo-me-link" href="./planner.html">내정보</a>
    </nav>
  </header>
  <main class="hanmo-main hanmo-support-main" id="main" tabindex="-1">
    <div class="hanmo-schoolmark" aria-label="학교 문의처 화면">
      <div class="hanmo-title-line"><span class="hanmo-title-help"><button class="hanmo-title-help-button" type="button" aria-label="학교 문의처 기능 안내" aria-describedby="support-page-help">i</button><span class="hanmo-title-help-tip" id="support-page-help" role="tooltip">문의 주제로 외부 검색 경로를 찾습니다.</span></span><h1>학교 문의처</h1></div>
      <div class="hanmo-title-divider" aria-hidden="true"><hr><span><img src="../img/hanmo_white.svg" alt=""></span><hr></div>
    </div>
    <section class="hanmo-card hanmo-support-search" aria-label="문의 검색과 추천 검색어">
      <form id="support-search-form" role="search" class="hanmo-form">
        <label for="support-query" class="hanmo-field">문의 주제
          <input id="support-query" name="query" type="search" maxlength="80" autocomplete="off" placeholder="예: 수강신청, 장학금, 휴학" aria-controls="support-suggestions">
        </label>
      </form>
      <div class="hanmo-support-suggestion-group">
        <h3 id="support-topic-heading">예시 검색어</h3>
        <div id="support-suggestions" class="hanmo-support-suggestions" aria-label="추천 검색어"></div>
      </div>
      <p class="hanmo-status" id="support-feedback" role="status" aria-live="polite">문의 주제를 입력하거나 추천 검색어를 선택하세요.</p>
      <div id="support-result" class="hanmo-support-result" hidden>
        <p id="support-result-text"></p>
        <a id="support-result-link" class="hanmo-btn secondary" target="_blank" rel="noopener noreferrer">Google에서 검색</a>
      </div>
      <p class="hanmo-support-caution">검색어는 한모에 저장하지 않습니다. Google에서 검색을 누르면 검색어가 Google에 전달됩니다. 개인정보는 입력하지 마세요.</p>
      
    </section>
  </main>
  <footer class="hanmo-policy-footer" aria-label="비공식 서비스 안내"><p><strong>본 서비스는 한국외국어대학교의 공식 서비스가 아니며, 정확한 정보는 학교 원문을 확인하시기 바랍니다.</strong></p></footer>
</body>
</html>
