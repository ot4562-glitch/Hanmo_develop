  <script src="../js/student-forecast.js" defer></script>
  <script src="../js/student-profile-bar.js" defer></script>

</head>
<body class="hanmo-ui">
  <a class="hanmo-skip" href="#main">본문으로 이동</a>
  <header class="hanmo-topbar">
  <a class="hanmo-brand" href="../index.html" aria-label="한모 홈으로 이동"><img src="../img/hanmo_white.svg" width="29" height="24" alt="">한모</a>
  <nav aria-label="주요 서비스">
    <a href="./readiness.html">PC 진단</a>
    <a href="./reaction-test.html">반응속도 테스트</a>
    <a href="./strategy-lab.html">전략 실험</a>
    <a href="./academic-timeline.html">학사 정보</a>
    <a href="./catalog.html">강의 검색</a>
    <span class="hanmo-profile-summary" data-profile-summary role="status" aria-live="polite" aria-label="브라우저에 저장한 내정보, 학교 로그인 아님">내정보 미설정</span>
    <a class="hanmo-me-link" href="./planner.html">내정보</a>
  </nav>
</header>
  <main id="main" class="hanmo-main" tabindex="-1">
  <div class="hanmo-schoolmark" aria-label="강의 개설 전망 화면">
    <h2>강의 개설 전망</h2>
    <div class="hanmo-title-divider" aria-hidden="true"><hr><span><img src="../img/hanmo_white.svg" alt=""></span><hr></div>

    
  </div>
<div class="hanmo-card-grid two">
  <section class="hanmo-card" aria-labelledby="form-title">
    <h2 id="form-title">조회 조건</h2>
    <form class="hanmo-form" id="forecast-form">
      <label class="hanmo-field" for="forecast-course-id">학수번호<input id="forecast-course-id" type="text" required maxlength="80" autocomplete="off" placeholder="학교 시간표에 표시된 학수번호"></label>
      <div class="hanmo-fields">
        <label class="hanmo-field" for="forecast-year">학년도<input id="forecast-year" type="number" min="2020" max="2099" step="1" required value="2027"></label>
        <label class="hanmo-field" for="forecast-semester">학기<select id="forecast-semester"><option value="1">1학기</option><option value="2">2학기</option></select></label>
      </div>
      <div class="hanmo-actions"><button class="hanmo-btn" type="submit">개설 근거 확인</button></div>
    </form>
  </section>
  <section class="hanmo-card" aria-labelledby="result-title">
    <h2 id="result-title">조회 결과</h2>
    <p class="hanmo-status" id="forecast-status" role="status">개설 자료 연결 확인 중</p>
    <div id="forecast-response" class="hanmo-result" aria-live="polite" hidden></div>
    <div class="hanmo-actions"><button id="forecast-retry" class="hanmo-btn secondary" type="button">연결 다시 시도</button><a class="hanmo-btn" href="https://hufs.ac.kr/" target="_blank" rel="noopener noreferrer">학교 공식 안내</a></div>
  </section>
</div>
</main>
  <footer class="hanmo-policy-footer" aria-label="비공식 서비스 안내"><p><strong>본 서비스는 한국외국어대학교의 공식 서비스가 아니며, 정확한 정보는 학교 원문을 확인하시기 바랍니다.</strong></p></footer>
</body>
</html>
