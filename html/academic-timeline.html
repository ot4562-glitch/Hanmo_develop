<!doctype html>
<html lang="ko">
<head>
  <script src="../js/pc-only.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="공개 학사 공지 원문 링크와 비공식 학사 달력을 한 화면에서 탐색">
  <title>학사 정보 | 한모</title>
  <link rel="icon" type="image/svg+xml" href="../img/favicon-purple.svg">
  <link rel="stylesheet" href="../css/student-ui.css">
  <link rel="stylesheet" href="../css/academic-calendar-vendor.css">
  <link rel="stylesheet" href="../css/academic-calendar.css">
  <link rel="stylesheet" href="../css/hanmo-policy-footer.css">
  <link rel="stylesheet" href="../css/hanmo-title-divider.css">
  <link rel="stylesheet" href="../css/hanmo-refined.css">
  <link rel="stylesheet" href="../css/academic-unified.css">
  <script src="../js/academic-data-source.js" defer></script>
  <script src="../js/student-notices.js" defer></script>
  <script src="../js/student-entry.js" defer></script>
  <script src="../js/academic-calendar.js" defer></script>
  <script src="../js/academic-unified.js" defer></script>
  <script src="../js/student-profile-bar.js" defer></script>
</head>
<body class="hanmo-ui hanmo-refined hanmo-academic-unified">
  <a class="hanmo-skip" href="#main">본문으로 이동</a>
  <header class="hanmo-topbar">
  <a class="hanmo-brand" href="../index.html" aria-label="한모 홈으로 이동"><img src="../img/hanmo_white.svg" width="29" height="24" alt="">한모</a>
  <nav aria-label="주요 서비스">
    <a href="./readiness.html">PC 진단</a>
    <a href="./reaction-test.html">반응속도 테스트</a>
    <a href="./strategy-lab.html">전략 실험</a>
    <a href="./academic-timeline.html" aria-current="page">학사 정보</a>
    <a href="./catalog.html">강의 검색</a>
    <span class="hanmo-profile-summary" data-profile-summary role="status" aria-live="polite" aria-label="브라우저에 저장한 내정보, 학교 로그인 아님">내정보 미설정</span>
    <a class="hanmo-me-link" href="./planner.html">내정보</a>
  </nav>
</header>
  <main id="main" class="hanmo-main" tabindex="-1">
    <div class="hanmo-schoolmark" aria-label="학사 정보 화면">
      <div class="hanmo-title-line"><span class="hanmo-title-help"><button class="hanmo-title-help-button" type="button" aria-label="학사 정보 기능 안내" aria-describedby="academic-page-help">i</button><span class="hanmo-title-help-tip" id="academic-page-help" role="tooltip">학사 공지와 월간 달력을 한곳에서 확인합니다.</span></span><h1>학사 정보</h1></div>
      <div class="hanmo-title-divider" aria-hidden="true"><hr><span><img src="../img/hanmo_white.svg" alt=""></span><hr></div>
    </div>
    <div class="academic-tabs" role="tablist" aria-label="학사 정보 선택">
      <button id="academic-notice-tab" type="button" role="tab" aria-controls="academic-notice-panel" aria-selected="true" tabindex="0">학사 공지</button>
      <button id="academic-calendar-tab" type="button" role="tab" aria-controls="academic-calendar-panel" aria-selected="false" tabindex="-1">학사 달력</button>
    </div>
    <section id="academic-notice-panel" role="tabpanel" aria-labelledby="academic-notice-tab" tabindex="0">
      <p class="hanmo-status" id="notice-context" role="status" aria-live="polite"></p>
      <section class="hanmo-card hanmo-search-controls" aria-label="공개 공지 필터">
        <form id="notice-filter" class="hanmo-form hanmo-search-form">
          <div class="hanmo-fields">
            <label class="hanmo-field" for="notice-query">검색어<input id="notice-query" type="search" placeholder="예: 수강신청" autocomplete="off" disabled></label>
            <label class="hanmo-field" for="notice-type">분야<select id="notice-type" disabled><option value="ALL">전체 공지</option><option value="MAJOR">전공·이중전공</option><option value="COURSE">수강·강의</option><option value="GRAD">졸업·성적</option><option value="OTHER">기타 학사</option></select></label>
          </div>
        </form>
      </section>
      <section class="hanmo-section-title" aria-label="공지 안내 상태"><p id="notice-count" role="status"></p></section>
      <div id="notice-list" class="hanmo-list" aria-live="polite"></div>
      <div class="academic-pagination">
        <button type="button" id="notice-prev" class="hanmo-btn secondary">이전 공지</button>
        <span id="notice-page" aria-live="polite">1 / 1</span>
        <button type="button" id="notice-next" class="hanmo-btn secondary">다음 공지</button>
      </div>
      <p class="hanmo-status" id="notice-status" role="status">공지 자료 연결 전입니다. 학교 원문에서 확인해 주세요.</p>
      <div class="hanmo-actions"><button id="notice-retry" class="hanmo-btn secondary" type="button" hidden>연결 다시 시도</button></div>
    </section>
    <section id="academic-calendar-panel" role="tabpanel" aria-labelledby="academic-calendar-tab" tabindex="0" hidden>
      <div class="academic-calendar-surface" aria-label="월간 학사 달력">
        <div id="calendar-view" aria-label="월간 달력"></div>
        <div class="academic-calendar-footer">
          <span id="calendar-status" role="status">학교 일정 연결 전</span>
          <a href="https://academic.hufs.ac.kr/academic/index.do" target="_blank" rel="noopener noreferrer">학교 학사일정 원문 ↗</a>
        </div>
      </div>
    </section>
  </main>
  <footer class="hanmo-policy-footer" aria-label="비공식 서비스 안내"><p><strong>본 서비스는 한국외국어대학교의 공식 서비스가 아니며, 정확한 정보는 학교 원문을 확인하시기 바랍니다.</strong></p></footer>
</body></html>
