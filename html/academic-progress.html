<!doctype html>
<html lang="ko">
<head>
  <script src="../js/pc-only.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="학점·이수 현황 · 한모 학생용 학업 도우미">
  <title>졸업 준비 | 한모</title>
  <link rel="icon" href="../img/hanmo_color.png">
  <link rel="stylesheet" href="../css/student-ui.css">
  <script src="../js/degree-preparation.js" defer></script>
  <link rel="stylesheet" href="../css/academic-progress.css">
  <script src="../js/student-profile-bar.js" defer></script>
</head>
<body class="hanmo-ui">
  <a class="hanmo-skip" href="#main">본문으로 이동</a>
  <header class="hanmo-topbar">
  <a class="hanmo-brand" href="../index.html" aria-label="한모 홈으로 이동"><img src="../img/hanmo_white.svg" width="29" height="24" alt="">한모 <span>HUFS 학업 도우미</span></a>
  <nav aria-label="주요 서비스">
    <a href="./academic-timeline.html">학사 공지</a>
    <a href="./catalog.html">강의 검색</a>
    <a href="./academic-progress.html" aria-current="page">졸업 준비</a>
    <details class="hanmo-tools"><summary>학업 도구</summary><div class="hanmo-tools-menu">
      <a href="./academic-calendar.html">학사 달력</a>
      <a href="./academic-faq.html">학사 FAQ</a>
      <a href="./academic-support.html">공식 상담</a>
    </div></details>
    <span class="hanmo-profile-summary" data-profile-summary role="status" aria-live="polite" aria-label="브라우저에 저장한 내정보, 학교 로그인 아님">내정보 미설정</span>
    <a class="hanmo-me-link" href="./planner.html">내정보</a>
  </nav>
</header>
  <main id="main" class="hanmo-main progress-main" tabindex="-1">
    <div class="progress-page-heading">
      <div class="hanmo-schoolmark">
        <h1>졸업 준비</h1>
        <div class="hanmo-markline" aria-hidden="true"><span></span><img src="../img/hanmo_white.svg" alt=""><span></span></div>
      </div>
          <a href="https://hufs.ac.kr/" target="_blank" rel="noopener noreferrer">학교 공식 안내</a>
    </div>
    <section class="degree-preparation" aria-label="졸업 준비">
      <div class="degree-profile-line" aria-label="입력한 학생 정보">
        <span id="degree-context-summary" role="status" aria-live="polite">내정보 미설정</span>
        <a href="./planner.html">수정</a>
      </div>
      <div class="degree-tabs" role="tablist" aria-label="졸업 준비 항목">
        <button id="degree-credits-tab" role="tab" type="button" data-degree-tab="credits" aria-controls="degree-credits-panel" aria-selected="true">학점</button>
        <button id="degree-requirements-tab" role="tab" type="button" data-degree-tab="requirements" aria-controls="degree-requirements-panel" aria-selected="false">졸업요건</button>
      </div>
      <section id="degree-credits-panel" role="tabpanel" aria-labelledby="degree-credits-tab" class="progress-panel">
        <h2>영역별 취득·남은 학점</h2>
        <p class="degree-caveat">자가 입력 · 공식 판정 아님</p>
        <form id="degree-credit-form">
          <div class="degree-credit-input-grid">
            <span>영역</span><span>취득 학점</span><span>목표 학점(직접 입력)</span>
            <label for="degree-earned-general">교양</label><input id="degree-earned-general" type="number" step="0.5" min="0" max="400" placeholder="0"><input id="degree-target-general" type="number" step="0.5" min="0" max="400" aria-label="교양 목표 학점">
            <label for="degree-earned-primary">본전공</label><input id="degree-earned-primary" type="number" step="0.5" min="0" max="400" placeholder="0"><input id="degree-target-primary" type="number" step="0.5" min="0" max="400" aria-label="본전공 목표 학점">
            <label for="degree-earned-secondary">이중전공·부전공</label><input id="degree-earned-secondary" type="number" step="0.5" min="0" max="400" placeholder="0"><input id="degree-target-secondary" type="number" step="0.5" min="0" max="400" aria-label="이중전공·부전공 목표 학점">
            <label for="degree-earned-other">기타·일반선택</label><input id="degree-earned-other" type="number" step="0.5" min="0" max="400" placeholder="0"><input id="degree-target-other" type="number" step="0.5" min="0" max="400" aria-label="기타 목표 학점">
            <label for="degree-earned-total">총 취득학점</label><input id="degree-earned-total" type="number" step="0.5" min="0" max="400" placeholder="비우면 영역 합계"><input id="degree-target-total" type="number" step="0.5" min="0" max="400" aria-label="총 졸업 목표 학점">
          </div>
          <div class="hanmo-actions"><button class="hanmo-btn" type="submit">이 브라우저에 저장</button><button class="hanmo-btn secondary" type="button" id="degree-credit-clear">저장한 학점 지우기</button></div>
        </form>
        <p id="degree-credit-message" class="progress-message" role="status" aria-live="polite"></p>
        <div id="degree-results" aria-live="polite"></div>
        <div id="degree-warnings" class="degree-warnings" role="status" aria-live="polite"></div>
      </section>
      <section id="degree-requirements-panel" role="tabpanel" aria-labelledby="degree-requirements-tab" class="progress-panel" hidden>
        <h2>전공별 졸업시험 · 논문 · 외국어 인증</h2>
        <p id="degree-official-note" class="degree-caveat">학교 공식 요건 확인 필요</p>
        <div id="degree-guidance" class="hanmo-list" aria-live="polite"></div>
      </section>
    </section>
  </main>
</body>
</html>
