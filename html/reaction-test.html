<body class="hanmo-ui hanmo-refined hanmo-lab hanmo-reaction">

  <header class="hanmo-topbar">
  <a class="hanmo-brand" href="../index.html" aria-label="한모 홈으로 이동"><img src="../img/hanmo_white.svg" width="29" height="24" alt="">한모</a>
  <nav aria-label="주요 서비스">

  </nav>
</header>
  <main id="main" class="hanmo-main lab-layout" tabindex="-1">
    <div class="hanmo-schoolmark" aria-label="반응속도 테스트 화면">
      <div class="hanmo-title-line"><span class="hanmo-title-help"><button class="hanmo-title-help-button" type="button" aria-label="반응속도 테스트 기능 안내" aria-describedby="reaction-page-help">i</button><span class="hanmo-title-help-tip" id="reaction-page-help" role="tooltip">화면 신호에 반응한 시간을 8회 측정합니다.</span></span><h1>반응속도 테스트</h1></div>

    </div>
    <section class="lab-panel" aria-labelledby="reaction-section">
      <div class="lab-section-heading"><h2 id="reaction-section">시각 신호 반응 측정</h2><span class="lab-minor" id="reaction-count">0 / 8</span></div>
      <button id="reaction-target" type="button" class="lab-reaction-target" data-phase="idle" disabled>시작을 누르세요</button>
      <div class="lab-actions"><button class="lab-button primary" id="reaction-start">8회 테스트 시작</button><button class="lab-button secondary" id="reaction-reset" hidden>취소</button></div>

    </section>
    <section class="lab-panel lab-result-panel" id="reaction-result" aria-label="반응속도 측정 결과" hidden>
      <p class="lab-summary" id="reaction-report"></p>
      <a class="lab-button primary lab-inline-link" href="./strategy-lab.html">전략 시뮬레이션에 자동 적용</a>
