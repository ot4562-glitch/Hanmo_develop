<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="../js/pc-only.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한모 - 가상 404</title>
  <link href="../img/hanmo_color.png" rel="shortcut icon" type="image/x-icon">
  <link href="../css/practice.css" rel="stylesheet">
  <link href="../css/normalize.css" rel="stylesheet">
  <link href="../css/incident-404.css" rel="stylesheet">
</head>
<body class="hanmo-synthetic-404">
  <main class="half">
    <nav class="navigation" aria-label="사용할 수 없는 모의신청 메뉴" aria-hidden="true" inert>
      <div class="userInfo">
        <h1>모의수강신청</h1>
        <p>연습 모드: BASIC MODE</p>
      </div>
      <div class="navButton">
        <button type="button" disabled tabindex="-1">메인 페이지</button>
        <button type="button" class="noticeButton" disabled tabindex="-1">Notice</button>
        <button type="button" disabled tabindex="-1">수강신청 및 수정/삭제</button>
        <button type="button" disabled tabindex="-1">수강신청열람</button>
        <button type="button" disabled tabindex="-1">시간표조회</button>
        <button type="button" disabled tabindex="-1">강의시간표조회</button>
      </div>
    </nav>
    <section class="hanmo-404-area" role="status" aria-labelledby="hanmo-404-title">
      <h2 id="hanmo-404-title">404</h2>
      <p>페이지를 표시할 수 없습니다.</p>
      <p>브라우저의 새로고침 또는 뒤로가기를 사용하세요.</p>
      <small>이 오류는 모의수강신청 돌발상황 연습이며 실제 학교 접속 장애가 아닙니다.</small>
    </section>
  </main>
  <script src="../js/incident-404.js"></script>

</html>
