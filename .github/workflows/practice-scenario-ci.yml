name: Practice synthetic scenario core
on:
  pull_request:
    paths:
      - 'js/scenario-engine.js'
      - 'tests/scenario-engine.test.cjs'
      - 'js/scenario-course-map.js'
      - 'tests/scenario-course-map.test.cjs'
      - '.github/workflows/practice-scenario-ci.yml'

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node --version
      - run: node --check js/scenario-engine.js && node --check js/scenario-course-map.js
      - run: node --test tests/scenario-engine.test.cjs tests/scenario-course-map.test.cjs
