name: Feature browser QA (#113-#116)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'html/selectZone.html'
      - 'js/selectZone.js'
      - 'html/academic-progress.html'
      - 'js/academic/app/degree-preparation.js'
      - 'js/academic/app/academic-calendar.js'
      - 'css/academic-calendar.css'
      - 'package.json'
      - 'tests/browser-feature.spec.mjs'
      - 'tests/playwright-feature.config.mjs'
      - 'scripts/serve-feature-preview.mjs'
      - 'scripts/serve-static.mjs'
      - '.github/workflows/feature-browser-qa.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install site dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned browser test runner for isolated QA
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.65.1
      - name: Build static site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real browser flows and capture four radio states
        run: npx playwright test --config tests/playwright-feature.config.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: hanmo-feature-browser-qa
          path: |
            e2e-artifacts/
            test-results/
          retention-days: 7
