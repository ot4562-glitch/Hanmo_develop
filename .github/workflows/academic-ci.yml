name: Repository checks
on:
  push:
    branches: [main, 'work/inline-degree-bars-flat-nav-20261123']
  pull_request:
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'js/**'
      - 'html/**'
      - 'css/**'
      - 'img/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'docs/architecture.md'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'e2e/**'
      - 'jsconfig.json'
      - '.github/workflows/academic-ci.yml'
permissions:
  contents: read
concurrency:
  group: hanmo-academic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core-and-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/assert-protected.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: hanmo-root-static-preview
          path: dist
          retention-days: 3
      - name: Install Chromium for real browser tests
        run: npx playwright install --with-deps chromium
      - name: Run Chromium end-to-end scenarios
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: hanmo-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
