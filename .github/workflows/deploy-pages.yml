name: Publish Hanmo QA preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jsconfig.json'
      - 'index.html'
      - 'sitemap.xml'
      - 'tests/**'
      - 'html/**'
      - 'js/**'
      - 'css/**'
      - 'img/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # wait for visible artifact metadata before deploying
  pages: write
  id-token: write

concurrency:
  group: github-pages-qa
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser-only planner dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository checks and build the preview
        run: npm run check
      - name: Protect the original site's custom domain
        run: |
          test ! -e CNAME
          test ! -e dist/CNAME
          test -f dist/index.html
          test -f dist/html/academic-timeline.html
          test -f dist/html/planner.html
          test -f dist/js/student-forecast.js
      - name: Configure GitHub Pages (fork project URL only)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload generated static site without CNAME
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      # REST에 먼저 나타난 산출물이 deploy-pages의 별도 조회에도 반영될 시간을 둔다.
      - name: Wait for the exact Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name')"; then
              count="$(printf '%s\n' "$names" | grep -Fxc -- "$PAGES_ARTIFACT_NAME" || true)"
              if [ "$count" -eq 1 ]; then
                echo "Exactly one current-attempt Pages artifact is visible."
                sleep 20
                exit 0
              fi
              if [ "$count" -gt 1 ]; then
                echo "::error::Duplicate artifact names in current attempt; not deploying."
                exit 1
              fi
            else
              echo "::warning::Artifact metadata API not ready (attempt $attempt)."
            fi
            sleep 3
          done
          echo "::error::Current-attempt Pages artifact did not become visible."
          exit 1
      - name: Deploy QA preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
