<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990" role="img" aria-labelledby="title desc"><title id="title">한모 공개 학사자료 연결과 상태별 안내</title><desc id="desc">학교 자료의 사용권 확인과 독립 검수·승인 이후에만 Supabase를 통해 공개 자료를 조회하고 오류 때는 확인되지 않은 데이터를 표시하지 않는 정책.</desc><defs><linearGradient id="h" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061928"/><stop offset=".6" stop-color="#0D3648"/><stop offset="1" stop-color="#155765"/></linearGradient><filter id="sh" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0A2F45" flood-opacity=".10"/></filter></defs><g font-family="Noto Sans CJK KR, Noto Sans KR, NanumSquare, Malgun Gothic, sans-serif"><rect x="0" y="0" width="1400" height="990" rx="0" fill="#F3F7FA" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1400" height="204" rx="0" fill="url(#h)" stroke="none" stroke-width="1.5"/><path d="M930 0Q1150 103 1400 31V0Z" fill="#298E8B" opacity=".23"/><rect x="58" y="32" width="70" height="70" rx="20" fill="none" stroke="#9FE2D4" stroke-width="1.5"/><text x="93" y="82" font-size="43" font-weight="850" fill="#FFFFFF" text-anchor="middle">H</text><text x="149" y="51" font-size="19" font-weight="700" fill="#9EDCD3" text-anchor="start">HANMO  /  DATA GOVERNANCE 03</text><text x="57" y="130" font-size="56" font-weight="840" fill="#FFFFFF" text-anchor="start">공개 학사자료 연결 원칙</text><text x="59" y="172" font-size="25" font-weight="520" fill="#DDECF2" text-anchor="start">학사자료 기본 비활성 · 권리 확인과 승인 후 조회</text><rect x="1112" y="54" width="231" height="47" rx="23" fill="#087A78" stroke="none" stroke-width="1.5"/><text x="1227" y="85" font-size="22" font-weight="780" fill="#FFFFFF" text-anchor="middle">현재: 미연결</text><rect x="57" y="222" width="1286" height="59" rx="17" fill="#E7F3F5" stroke="#DBE5EC" stroke-width="1.5"/><g transform="translate(76 227) scale(.82)"><path d="M12 21V14A12 12 0 0 1 36 14V21M10 21H38V45H10Z" fill="none" stroke="#087A78" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="138" y="259" font-size="24" font-weight="800" fill="#173247" text-anchor="start">연결 설정은 기본 disabled</text><text x="497" y="258" font-size="21" font-weight="560" fill="#5C7484" text-anchor="start">학교 자료 사용 허가·실제 DB 연결·검수 승인은 아직 완료되지 않았습니다.</text><g filter="url(#sh)"><rect x="57" y="315" width="309" height="250" rx="23" fill="#FFFFFF" stroke="#DBE5EC" stroke-width="1.5"/></g><rect x="57" y="315" width="309" height="67" rx="21" fill="#09283A" stroke="none" stroke-width="1.5"/><rect x="57" y="362" width="309" height="20" rx="0" fill="#09283A" stroke="none" stroke-width="1.5"/><text x="77" y="358" font-size="29" font-weight="830" fill="#FFFFFF" text-anchor="start">1  공식 자료</text><rect x="79" y="409" width="72" height="72" rx="20" fill="#E9F7F4" stroke="none" stroke-width="1.5"/><g transform="translate(95 422) scale(.82)"><path d="M7 4H33L42 13V45H7ZM33 4V13H42M14 23H34M14 31H34" fill="none" stroke="#087A78" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="79" y="516" font-size="23" font-weight="740" fill="#173247" text-anchor="start">학교 공식 공지·강의</text><text x="79" y="549" font-size="19" font-weight="550" fill="#5C7484" text-anchor="start">허가 가능한 범위 확인</text><path d="M367 443L379 443" fill="none" stroke="#E5AE4C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/><path d="M367 434L379 443L367 452" fill="none" stroke="#E5AE4C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g filter="url(#sh)"><rect x="383" y="315" width="309" height="250" rx="23" fill="#FFFFFF" stroke="#DBE5EC" stroke-width="1.5"/></g><rect x="383" y="315" width="309" height="67" rx="21" fill="#087A78" stroke="none" stroke-width="1.5"/><rect x="383" y="362" width="309" height="20" rx="0" fill="#087A78" stroke="none" stroke-width="1.5"/><text x="403" y="358" font-size="29" font-weight="830" fill="#FFFFFF" text-anchor="start">2  독립 검수</text><rect x="405" y="4