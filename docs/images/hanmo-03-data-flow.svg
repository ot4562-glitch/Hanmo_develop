  비밀키 비노출    /    공식 원문 확인 경로 제공</text><text x="57" y="974" font-size="18" font-weight="570" fill="#5C7484" text-anchor="start">HANMO DEVELOP  ·  Supabase 공개 읽기 구조는 준비 중이며 실운영 승인 전입니다.</text><text x="1342" y="974" font-size="18" font-weight="570" fill="#5C7484" text-anchor="end">2026.11  /  03</text></g></svg>
