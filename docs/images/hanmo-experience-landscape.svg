<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">한모의 현재 경험: 비공식 모의수강신청과 공식 원문 링크 안내</title>
<desc id="desc">왼쪽은 BASIC TIME SELECT 및 기본 OFF인 가상 404·정원 마감, 오른쪽은 학교 공개 공지 링크, 비식별 개설 전망, 학사 달력를 보여 줍니다. 학교 공식 자료와 Supabase는 아직 연결되지 않았습니다.</desc>
