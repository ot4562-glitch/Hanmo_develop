  <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F3040"/><stop offset="1" stop-color="#102431"/></linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94C8DB" stroke-opacity=".065"/></pattern>
