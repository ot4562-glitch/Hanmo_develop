<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="866" viewBox="0 0 1320 866" role="img" aria-labelledby="title desc"><title id="title">Hanmo Develop 기능 미리보기</title><desc id="desc">현재 프로젝트의 학사 공지, 강의 전망, BASIC TIME SELECT 모의수강신청을 검수 상태와 함께 표현한 설명용 화면 구성도.</desc><defs>
<linearGradient id="preview-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00111C"/><stop offset="1" stop-color="#0D2D40"/></linearGradient>
<pattern id="preview-grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#7CB6C6" stroke-opacity=".055"/></pattern></defs><g font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="0" y="0" width="1320" height="866" rx="22" fill="url(#preview-bg)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1320" height="866" rx="0" fill="url(#preview-grid)" stroke="none" stroke-width="1"/><rect x="57" y="48" width="5" height="42" rx="2" fill="#F4C76C" stroke="none" stroke-width="1"/><text x="78" y="72" font-size="33" fill="#F2F5F8" font-weight="790" >한모, 지금 만들고 있는 학업 경험</text><text x="79" y="105" font-size="15" fill="#ABC6D6" font-weight="560" >승인자료 연결 전  ·  PC 전용  ·  비공식 개발용 구성도</text><rect x="1069" y="58" width="194" height="35" rx="18" fill="#3E3323" stroke="#866A44" stroke-width="1"/><text x="1166" y="82" font-size="13" fill="#F4C76C" font-weight="770" text-anchor="middle" letter-spacing="1.5">MAIN BRANCH</text><rect x="57" y="143" width="760" height="598" rx="18" fill="#071723" stroke="#41647A" stroke-width="1.5"/><rect x="58" y="144" width="758" height="65" rx="16" fill="#00111B" stroke="none" stroke-width="1"/><rect x="58" y="192" width="758" height="17" rx="0" fill="#00111B" stroke="none" stroke-width="1"/><text x="85" y="184" font-size="24" fill="#FFFFFF" font-weight="850" >한모</text><text x="145" y="182" font-size="12" fill="#B9C9D5" font-weight="450" >HUFS 학업 도우미</text><text x="451" y="184" font-size="14" fill="#F4C76C" font-weight="790" >학사 공지</text><text x="549" y="184" font-size="14" fill="#B8C9D5" font-weight="550" >강의 전망</text><text x="655" y="184" font-size="14" fill="#B8C9D5" font-weight="550" >강의 검색</text><text x="96" y="267" font-size="31" fill="#F2F5F8" font-weight="780" >학사 공지</text><line x1="96" y1="284" x2="778" y2="284" stroke="#34556A" stroke-width="1"/><rect x="97" y="310" width="681" height="54" rx="11" fill="#3B3324" stroke="#8F754B" stroke-width="1"/><circle cx="118" cy="336" r="10" fill="#F4C76C"/><text x="114" y="341" font-size="15" fill="#00111B" font-weight="900" >!</text><text x="139" y="334" font-size="15" fill="#FFDFAD" font-weight="700" >전공별 적용 대상은 아직 검수 전입니다.</text><text x="139" y="354" font-size="12" fill="#E5D5B6" font-weight="500" >승인된 공지가 연결되기 전까지 목록은 비어 있습니다.</text><rect x="97" y="387" width="681" height="112" rx="12" fill="#0C2535" stroke="#41647A" stroke-width="1"/><text x="119" y="417" font-size="17" fill="#F3F5F8" font-weight="720" >어떤 공지를 찾으세요?</text><rect x="118" y="434" width="411" height="44" rx="8" fill="#142F42" stroke="#567A93" stroke-width="1"/><text x="133" y="462" font-size="13" fill="#9CB8C8" font-weight="450" >검색어 입력  ·  예: 수강신청, 졸업시험</text><rect x="541" y="434" width="214" height="44" rx="8" fill="#142F42" stroke="#567A93" stroke-width="1"/><text x="558" y="462" font-size="14" fill="#D1DFE7" font-weight="650" >전체 공지   ⌄</text><text x="99" y="540" font-size="20" fill="#F3F5F8" font-weight="750" >승인된 공개 공지 목록</text><rect x="98" y="558" width="677" height="69" rx="11" fill="#102B3B" stroke="#32536B" stroke-width="1"/><rect x="111" y="578" width="98" height="27" rx="7" fill="#1C455C" stroke="none" stroke-width="1"/><text x="160" y="597" font-size="12" fill="#C9E0EA" font-weight="700" text-anchor="middle">원문 확인</text><text x="230" y="587" font-size="15" fill="#F2F5F8" font-weight="690" >미연결·자료 없음·연결 오류를 구분</text><text x="230" y="607" font-size="12" fill="#AFC5D2" font-weight="500" >실제 지원 여부는 학교 공지에서 재확인</text><rect x="98" y="638" width="677" height="65" rx="11" fill="#102B3B" stroke="#32536B" stroke-width="1"/><rect x="112" y="656" width="101" height="28" rx="7" fill="#3B3323" stroke="none" stroke-width="1"/><text x="162" y="675" font-size="12" fill="#F4C76C" font-weight="730" text-anchor="middle">확인 필요</text><text x="230" y="665" font-size="15" fill="#F2F5F8" font-weight="690" >정정·취소·대상 조건을 구분</text><text x="230" y="685" font-size="12" fill="#B1C5D2" font-weight="500" >학생별 공식 판정이나 D-day 안내 아님</text><rect x="844" y="143" width="419" height="280" rx="18" fill="#071723" stroke="#41647A" stroke-width="1.5"/><rect x="870" y="169" width="5" height="32" rx="2" fill="#F4C76C" stroke="none" stroke-width="1"/><text x="889" y="194" font-size="24" fill="#F2F5F8" font-weight="800" >강의 개설 전망</text><text x="872" y="224" font-size="13" fill="#B8C9D5" font-weight="530" >학수번호와 학기를 입력해 개설 근거를 확인</text><rect x="870" y="242" width="363" height="44" rx="9" fill="#142E41" stroke="#52748D" stroke-width="1"/><text x="888" y="270" font-size="14" fill="#9FB7C5" font-weight="500" >학수번호 입력</text><rect x="870" y="299" width="363" height="42" rx="9" fill="#3D3325" stroke="#826947" stroke-width="1"/><circle cx="891" cy="320" r="6" fill="#F4C76C"/><text x="908" y="325" font-size="14" fill="#FFE0AB" font-weight="730" >공식 강의 개설 원장 미연결</text><rect x="871" y="357" width="158" height="42" rx="9" fill="#F4C76C" stroke="none" stroke-width="1"/><text x="950" y="383" font-size="14" fill="#0B1720" font-weight="800" text-anchor="middle">연결 다시 시도</text><text x="1046" y="383" font-size="12" fill="#A6BECF" font-weight="530" >* 승인된 개설 근거 아직 없음</text><rect x="844" y="443" width="419" height="298" rx="18" fill="#071723" stroke="#41647A" stroke-width="1.5"/><rect x="870" y="468" width="5" height="33" rx="2" fill="#F4C76C" stroke="none" stroke-width="1"/><text x="889" y="493" font-size="24" fill="#F2F5F8" font-weight="800" >모의수강신청</text><text x="871" y="524" font-size="13" fill="#B8C9D5" font-weight="550" >기본 연습 모드를 유지합니다</text><rect x="871" y="544" width="109" height="98" rx="10" fill="#113047" stroke="#4F748A" stroke-width="1"/><text x="925" y="580" font-size="16" fill="#FFFFFF" font-weight="820" text-anchor="middle">BASIC</text><line x1="886" y1="592" x2="965" y2="592" stroke="#365F76" stroke-width="1"/><text x="925" y="613" font-size="12" fill="#C4D9E4" font-weight="580" text-anchor="middle">전체 과정</text><rect x="993" y="544" width="109" height="98" rx="10" fill="#113047" stroke="#4F748A" stroke-width="1"/><text x="1047" y="580" font-size="16" fill="#FFFFFF" font-weight="820" text-anchor="middle">TIME</text><line x1="1008" y1="592" x2="1087" y2="592" stroke="#365F76" stroke-width="1"/><text x="1047" y="613" font-size="12" fill="#C4D9E4" font-weight="580" text-anchor="middle">타이밍</text><rect x="1115" y="544" width="109" height="98" rx="10" fill="#113047" stroke="#4F748A" stroke-width="1"/><text x="1169" y="580" font-size="16" fill="#FFFFFF" font-weight="820" text-anchor="middle">SELECT</text><line x1="1130" y1="592" x2="1209" y2="592" stroke="#365F76" stroke-width="1"/><text x="1169" y="613" font-size="12" fill="#C4D9E4" font-weight="580" text-anchor="middle">과목 선택</text><rect x="870" y="659" width="363" height="56" rx="10" fill="#233023" stroke="#5B6850" stroke-width="1"/><text x="889" y="683" font-size="14" fill="#F2F5F8" font-weight="740" >선택형 돌발상황</text><text x="889" y="702" font-size="12" fill="#CFDECE" font-weight="550" >정원 마감 · 가상 404 / 기본 OFF</text><line x1="58" y1="774" x2="1260" y2="774" stroke="#3B6074" stroke-width="1"/><text x="69" y="807" font-size="16" fill="#F4C76C" font-weight="760" >다른 화면</text><text x="169" y="807" font-size="15" fill="#D9E5EC" font-weight="600" >내정보(브라우저 저장)   /   강의 검색(자료 연결 대기)   /   학점 정리(자가 입력)</text><text x="69" y="840" font-size="13" fill="#9CBACD" font-weight="500" >실제 화면을 그대로 캡처한 이미지가 아닌, 현재 제공 기능과 한계를 설명하는 시각화입니다.</text></g></svg>