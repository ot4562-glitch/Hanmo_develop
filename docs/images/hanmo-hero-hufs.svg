<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="432" viewBox="0 0 1280 432" role="img" aria-labelledby="title desc"><title id="title">Hanmo Develop 비공식 합성 연습과 다섯 학생용 기능 배너</title><desc id="desc">남색과 금색 한모 디자인으로 BASIC/TIME/SELECT 합성 연습, PC 진단·반응속도·가상 전략 실험, 학사정보·강의 검색의 자료 미연결 상태를 표현한 비공식 콘셉트 일러스트.</desc><defs>
<linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00101B"/><stop offset=".57" stop-color="#082336"/><stop offset="1" stop-color="#113950"/></linearGradient>
