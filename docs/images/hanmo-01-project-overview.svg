<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990" role="img" aria-labelledby="title desc"><title id="title">한모 프로젝트 핵심 소개</title><desc id="desc">비공식 모의수강신청 연습과 학사 지원 화면, 안전한 공개 자료 사용 정책의 현행 상태를 소개합니다.</desc><defs><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061A29"/><stop offset=".58" stop-color="#0A3046"/><stop offset="1" stop-color="#155A67"/></linearGradient><filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173448" flood-opacity=".10"/></filter><pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity=".08"/></pattern></defs><g font-family="Noto Sans CJK KR, Noto Sans KR, NanumSquare, Malgun Gothic, sans-serif"><rect x="0" y="0" width="1400" height="990" rx="0" fill="#F3F7FA" stroke="none" stroke-width="1.3"/><rect x="0" y="0" width="1400" height="202" rx="0" fill="url(#head)" stroke="none" stroke-width="1.3"/><rect x="0" y="0" width="1400" height="202" rx="0" fill="url(#grain)" stroke="none" stroke-width="1.3"/><path d="M880 0Q1090 118 1400 37V0Z" fill="#277F88" opacity=".24"/><rect x="57" y="34" width="70" height="70" rx="20" fill="none" stroke="#82D4C5" stroke-width="1.3"/><text x="92" y="84" text-anchor="middle" fill="#FFFFFF" font-size="43" font-weight="850">H</text><text x="149" y="51" text-anchor="start" fill="#8CDBCF" font-size="19" font-weight="720">HANMO  /  ACADEMIC SUPPORT REFERENCE</text><text x="57" y="130" text-anchor="start" fill="#FFFFFF" font-size="59" font-weight="840">한모 프로젝트 개요</text><text x="59" y="172" text-anchor="start" fill="#DAECF4" font-size="26" font-weight="520">수강신청 연습에서 학업 준비까지 · 학생 중심 PC 웹</text><rect x="1124" y="54" width="211" height="47" rx="23" fill="#087A78" stroke="none" stroke-width="1.3"/><text x="1229" y="85" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="760">비공식 학생 프로젝트</text><rect x="57" y="220" width="273" height="43" rx="19" fill="#087A78" stroke="none" stroke-width="1.3"/><text x="193" y="249" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="750">실제 구현 범위</text><rect x="344" y="220" width="338" height="43" rx="19" fill="#FFF0D7" stroke="none" stroke-width="1.3"/><text x="513" y="249" text-anchor="middle" fill="#7A5724" font-size="21" font-weight="750">공식 학사자료 아직 미연결</text><g filter="url(#shadow)"><rect x="57" y="286" width="620" height="250" rx="24" fill="#FFFFFF" stroke="#D8E5EC" stroke-width="1.3"/></g><rect x="57" y="286" width="620" height="68" rx="24" fill="#0A2539" stroke="none" stroke-width="1.3"/><rect x="57" y="331" width="620" height="23" rx="0" fill="#0A2539" stroke="none" stroke-width="1.3"/><circle cx="95" cy="321" r="19" fill="#FFFFFF24"/><text x="95" y="330" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="800">01</text><text x="135" y="329" text-anchor="start" fill="#FFFFFF" font-size="30" font-weight="800">모의수강신청 연습</text><circle cx="95" cy="397" r="18" fill="#E8F7F3"/><path d="M87 397L94 404L106 388" fill="none" stroke="#087A78" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><text x="129" y="396" text-anchor="start" fill="#143146" font-size="26" font-weight="750">BASIC · TIME · SELECT</text><text x="129" y="428" text-anchor="start" fill="#587182" font-size="21" font-weight="520">세 가지 선택 가능한 연습 모드</text><path d="M87 446L647 446" stroke="#D8E5EC" stroke-width="2" stroke-linecap="round"/><circle cx="95" cy="480" r="18" fill="#E8F7F3"/><path d="M87 480L94 487L106 471" fill="none" stroke="#087A78" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><text x="129" y="479" text-anchor="start" fill="#143146" font-size="26" font-weight="750">가상 신청 실패 · 가상 404</text><text x="129" y="511" text-anchor="start" fill="#587182" font-size="21" font-weight="520">두 가지 선택 옵션 · 기본 OFF</text><g filter="url(#shadow)"><rect x="723" y="286" width="620" height="250" rx="24" fill="#FFFFFF" stroke="#D8E5EC" stroke-width="1.3"/></g><rect x="723" y="286" width="620" height="68" rx="24" fill="#087A78" stroke="none" stroke-width="1.3"/><rect x="723" y="331" width="620" height="23" rx="0" fill="#087A78" stroke="none" stroke-width="1.3"/><circle cx="761" cy="321" r="19" fill="#FFFFFF24"/><text x="761" y="330" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="800">02</text><text x="801" y="329" text-anchor="start" fill="#FFFFFF" font-size="30" font-weight="800">학업 정보 탐색</text><circle cx="761" cy="397" r="18" fill="#E8F7F3"/><path d="M753 397L760 404L772 388" fill="none" stroke="#087A78" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><text x="795" y="396" text-anchor="start" fill="#143146" font-size="26" font-weight="750">학사공지 · 강의검색 · 강의전망</text><text x="795" y="428" text-anchor="start" fill="#587182" font-size="21" font-weight="520">승인된 공개 자료 조회 경로 준비</text><path d="M753 446L1313 446" stroke="#D8E5EC" stroke-width="2" stroke-linecap="round"/><circle cx="761" cy="480" r="18" fill="#E8F7F3"/><path d="M753 480L760 487L772 471" fill="none" stroke="#087A78" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><text x="795" y="479" text-anchor="start" fill="#143146" font-size="26" font-weight="750">현재는 연결 대기 상태</text><text x="795" y="511" text-anchor="start" fill="#587182" font-size="21" font-weight="520">임의 강좌·마감일을 생성하지 않음</text><g filter="url(#shadow)"><rect x="57" y="560" width="620" height="250" rx="24" fill="#FFFFFF" stroke="#D8E5EC" stroke-width="1.3"/></g><rect x="57" y="560" width="620" height="68" rx="24" fill="#087A78" stroke="none" stroke-width="1.3"/><rect x="57" y="605" width="620" height="23" rx="0" fill="#087A78" stroke="none" stroke-width="1.3"/><circle cx="95" cy="595" r="19" fill="#FFFFFF24"/><text x="95" y="604" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="800">03</text><text x="135" y="603" text-anchor="start" fill="#FFFFFF" font-size="30" font-weight="800">학생 자가 입력 도구</text><circle cx="95" cy="671" r="18" fill="#E8F7F3"/><path d="M87 671L94 678L106 662" fill="none" stroke="#087A78" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><text x="129" y="670" text-anchor="start" fill="#143146" font-size="26" font-weight="750">내정보 · 학점 정리</text><text x="129" y="702" text-anchor="start" fill="#587182" font-size="21" font-weight="520">학생 본인이 입력하는 참고 기능</text><path d="M87 720L647 720" stroke="#D8E5EC" stroke-width="2" stroke-linecap="round"/><circle cx="95" cy="754" r="18" fill="#E8F7F3"/><path d="M87 754L94 761L106 745" fill="none" stroke="#087A78" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><text x="129" y="753" text-anchor="start" fill="#143146" font-size="26" font-weight="750">브라우저에만 저장</text><text x="129" y="785" text-anchor="start" fill="#587182" font-size="21" font-weight="520">학생정보를 서버에 자동 전송하지 않음</text><g filter="url(#shadow)"><rect x="723" y="560" width="620" height="250" rx="24" fill="#FFFFFF" stroke="#D8E5EC" stroke-width="1.3"/></g><rect x="723" y="560" width="620" height="68" rx="24" fill="#0A2539" stroke="none" stroke-width="1.3"/><rect x="723" y="605" width="620" height="23" rx="0" fill="#0A2539" stroke="none" stroke-width="1.3"/><circle cx="761" cy="595" r="19" fill="#FFFFFF24"/><text x="761" y="604" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="800">04</text><text x="801" y="603" text-anchor="start" fill="#FFFFFF" font-size="30" font-weight="800">출처와 안전 원칙</text><circle cx="761" cy="671" r="18" fill="#E8F7F3"/><path d="M753 671L760 678L772 662" fill="none" stroke="#087A78" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><text x="795" y="670" text-anchor="start" fill="#143146" font-size="26" font-weight="750">원본 연습·공식 서비스 분리</text><text x="795" y="702" text-anchor="start" fill="#587182" font-size="21" font-weight="520">실제 수강신청/졸업사정과 미연동</text><path d="M753 720L1313 720" stroke="#D8E5EC" stroke-width="2" stroke-linecap="round"/><circle cx="761" cy="754" r="18" fill="#E8F7F3"/><path d="M753 754L760 761L772 745" fill="none" stroke="#087A78" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><text x="795" y="753" text-anchor="start" fill="#143146" font-size="26" font-weight="750">미연결 · 자료 없음 · 오류 구분</text><text x="795" y="785" text-anchor="start" fill="#587182" font-size="21" font-weight="520">출처가 불명확하면 결과 대신 안내</text><g filter="url(#shadow)"><rect x="57" y="843" width="1286" height="99" rx="22" fill="#FFFFFF" stroke="#D8E5EC" stroke-width="1.3"/></g><rect x="57" y="843" width="10" height="99" rx="5" fill="#E6AD50" stroke="none" stroke-width="1.3"/><text x="93" y="887" text-anchor="start" fill="#143146" font-size="29" font-weight="820">학사종합지원센터 검토 요청</text><text x="94" y="921" text-anchor="start" fill="#587182" font-size="22" font-weight="530">학사자료 공개·재사용 가능 범위, 공식 원문 링크 정책, 정정·철회 정보 안내 기준</text><text x="57" y="974" text-anchor="start" fill="#587182" font-size="18" font-weight="600">HANMO DEVELOP  ·  학교가 운영하는 공식 서비스가 아닙니다.</text><text x="1341" y="974" text-anchor="end" fill="#587182" font-size="18" font-weight="600">2026.11  /  01</text></g></svg>
